services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_chatbot_db
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
    ports:
      # Use 5433 on host to avoid clashing with local Postgres installs
      - "5433:5432"
    volumes:
      - rag_chatbot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rag_chatbot_pgdata:

